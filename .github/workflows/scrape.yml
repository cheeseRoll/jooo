# Raw scraping runs HERE (GitHub runners have open egress; the Claude session's
# network policy blocks the ATS/job-board hosts). The nightly Claude Routine then
# pulls the committed data and does scoring/dashboard/tracker.
#
# Mode is auto-decided: no data/companies.yaml yet -> probe (build the watchlist
# from data/candidates.txt), otherwise scrape. workflow_dispatch can force either.
name: scrape

on:
  schedule:
    - cron: "0 15 * * *"   # 20:30 IST nightly
  push:
    paths:
      - ".github/workflows/scrape.yml"
      - "data/candidates.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | scrape | probe"
        default: auto
      days:
        description: "lookback days for search sources"
        default: "7"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          MODE="${{ inputs.mode || 'auto' }}"
          if [ "$MODE" = "auto" ]; then
            if [ -f data/companies.yaml ]; then MODE=scrape; else MODE=probe; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "running in mode: $MODE"

      - name: Probe ATS boards
        if: steps.mode.outputs.mode == 'probe'
        run: python3 scraper/sources/probe.py --file data/candidates.txt --out data/companies.yaml

      - name: Scrape
        if: steps.mode.outputs.mode == 'scrape'
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python3 scraper/run.py --days "${{ inputs.days || '7' }}"

      - name: Commit results
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase
          git add data/
          git diff --cached --quiet || git commit -m "data: ${{ steps.mode.outputs.mode }} $(date -u +%F)"
          git push
